services:
  postgres:
    image: postgres:16-alpine
    container_name: lawyer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lawyer
      POSTGRES_USER: lawyer
      POSTGRES_PASSWORD: lawyerpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: lawyer-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: lawyer-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: lawyer
      RABBITMQ_DEFAULT_PASS: lawyerpass
    ports:
      - "5672:5672"
      - "15672:15672"

  minio:
    image: minio/minio:latest
    container_name: lawyer-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-create-bucket:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do
        echo 'waiting for minio...';
        sleep 2;
      done;
      mc mb --ignore-existing local/lawyer-documents-bucket;
      mc anonymous set download local/lawyer-documents-bucket;
      exit 0;"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lawyer-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      minio-create-bucket:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lawyer
      SPRING_DATASOURCE_USERNAME: lawyer
      SPRING_DATASOURCE_PASSWORD: lawyerpass
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      JWT_SECRET: lawyer-local-secret-change-me
      JWT_EXPIRATION: 86400000
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: lawyer
      SPRING_RABBITMQ_PASSWORD: lawyerpass
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_SESSION_STORE_TYPE: redis
      AWS_S3_ENDPOINT: http://minio:9000
      AWS_S3_ACCESS_KEY: minioadmin
      AWS_S3_SECRET_KEY: minioadmin
      AWS_S3_REGION: us-east-1
      AWS_S3_BUCKET_NAME: lawyer-documents-bucket

volumes:
  postgres_data:
  minio_data:
