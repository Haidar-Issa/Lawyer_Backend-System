spring.application.name=Lawyer_BackEnd_System

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=${DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}

# Connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.allow-pool-suspension=true

# Database
spring.datasource.url=jdbc:postgresql://db.vbqyxraxzecqcrrhjnam.supabase.co:5432/postgres
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:Haidar121995H@}
spring.datasource.driver-class-name=${DATABASE_DRIVER_CLASS_NAME:org.postgresql.Driver}

# Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Time layout
spring.jackson.time-zone=Asia/Riyadh
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# Docker
spring.docker.compose.enabled=false

# JWT secret
jwt.secret=${JWT_SECRET:lawyer-local-secret-change-me}
jwt.expiration=${JWT_EXPIRATION:86400000}
